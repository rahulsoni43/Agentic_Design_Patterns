# Sample nginx configuration for testing
# This has some intentional issues for the agent to find

server {
    listen 80;
    server_name example.com;

    # Missing SSL configuration
    # Missing security headers

    location / {
        proxy_pass http://backend;
        # Missing timeout settings
        # Missing error handling
    }

    location /admin {
        # Security issue: no access restrictions
        proxy_pass http://backend/admin;
    }

    # Hardcoded upstream (not flexible)
    upstream backend {
        server 127.0.0.1:8080;
        # Single point of failure - no redundancy
    }
}
