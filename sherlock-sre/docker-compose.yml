version: '3.8'

services:
  sherlock:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: sherlock-sre
    env_file:
      - .env
    volumes:
      # Mount kubeconfig for cluster access
      - ~/.kube:/root/.kube:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL for Phase 2 (incident storage)
